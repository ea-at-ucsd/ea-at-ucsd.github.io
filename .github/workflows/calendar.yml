name: Update events

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_calendar.py
      - .github/workflows/calendar.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install icalendar recurring-ical-events

      - run: python fetch_calendar.py

      - name: Commit if the events changed
        run: |
          if [[ -n "$(git status --porcelain events.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Update events from calendar"
            git push
          else
            echo "No change."
          fi
